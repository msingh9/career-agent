<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 14px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #64748b;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      p {
        font-size: 12px;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <h3 style="margin-top: 0">Career Agent</h3>
    <p>Connect to your local Career Agent API.</p>
    <label>API URL</label>
    <input id="apiBase" value="http://127.0.0.1:8000" />
    <button id="saveBtn" type="button">Save</button>
    <button id="testBtn" type="button" style="margin-top: 8px; background: #0f766e">Test connection</button>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
